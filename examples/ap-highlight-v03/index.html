<html><head><meta charset="utf-8"><title>AI Accounts Payable Assistant — Highlight v03</title>
<style>

/* Laiye Worker light theme, sampled from the 2026-10-23 recording */
:root{--bg:#FAFAFA;--side:#F2F2F2;--line:#E6E6E6;--bub:#F0F0F0;--opt:#E9E9E9;--optS:#DCDCDC;--ink:#1F1F1F;--ink2:#3A3A3A;--mute:#8A8A8A;--faint:#B5B5B5;--link:#2F6BD8;--ok:#2FA55A;--warn:#D9483B;--coral:#F0705F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#wall{position:absolute;inset:0}
.star{position:absolute;background:#fff;border-radius:50%}

.tb-r{position:absolute;right:16px;top:0;height:48px;display:flex;align-items:center;gap:20px;font-size:13px}

.tb-clock b{font-weight:500;font-size:14px}.tb-clock small{font-size:12px;opacity:.75}
.toast{z-index:20;position:absolute;width:460px;background:rgba(250,250,250,.98);border:1px solid rgba(0,0,0,.08);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:14px 16px 16px;transform-origin:50% 100%;color:#1F1F1F}

.s-top{height:58px;display:flex;align-items:center;padding:0 12px}.s-top b{font-size:23px;font-weight:650;letter-spacing:-.01em}

.bub{display:inline-block;background:var(--bub);border-radius:14px;padding:11px 17px;color:var(--ink);max-width:896px}

.ub{background:#F6EEDF;border-radius:20px;padding:10px 18px;color:var(--ink)}
.thk{color:#4A4A4A;display:inline-flex;align-items:center;gap:12px;font-size:16px;border-radius:20px}
.tdots{display:inline-flex;gap:5px}.tdots i{width:6px;height:6px;border-radius:50%;background:#6A6A6A;display:block}
.q{background:var(--bub);border-radius:14px;padding:16px 17px 16px}

.opts{border-radius:9px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #DDDDDD;background:#DDDDDD;gap:1px}
.op{display:flex;align-items:center;gap:14px;height:50px;padding:0 16px 0 14px;background:var(--opt);font-size:17px;color:var(--ink)}
.op.sel,.op.hl{background:var(--optS)}

.op .ck{margin-left:auto;color:#3A3A3A;display:flex}
.free{margin-top:12px;height:46px;border-radius:9px;background:#FFFFFF;border:1px solid #E2E2E2;display:flex;align-items:center;padding:0 15px;font-size:16.5px;color:#9A9A9A}

.sub{background:#A9A9A9;color:#FFFFFF;border-radius:8px;padding:9px 18px;font-size:16.5px;font-weight:650}.sub.on{background:#171717}.sub.hot{background:#000;box-shadow:0 0 0 4px rgba(0,0,0,.12)}
.prog{display:inline-block;background:var(--bub);border-radius:14px;padding:14px 22px 12px 17px;font-size:16.5px}

.ib{position:absolute;left:24px;right:24px;bottom:18px;display:flex;align-items:center;gap:14px}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.44);z-index:8}

.addb{display:flex;align-items:center;gap:7px;border:1.5px solid #CDAA2E;background:#36321F;color:#F2CC40;font-weight:650;font-size:16.5px;border-radius:22px;padding:8px 16px}

/* browser windows (Google Sheets, Xero) */
.bw{z-index:12;position:absolute;background:#FFFFFF;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 40px 100px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.25);transform-origin:50% 100%}
